name: Build Cat Empire APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDKs necessários
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build APK (debug)
        run: |
          GRADLE_VERSION=8.7
          curl --fail --location --retry 3 --output gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q gradle.zip
          cd CatEmpireCast
          ../gradle-${GRADLE_VERSION}/bin/gradle assembleDebug --stacktrace --no-daemon

      - name: Renomear APK
        run: cp CatEmpireCast/app/build/outputs/apk/debug/app-debug.apk CatEmpireCast/app/build/outputs/apk/debug/CatEmpire.apk

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: CatEmpire
          path: CatEmpireCast/app/build/outputs/apk/debug/CatEmpire.apk
