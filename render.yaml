services:
  - type: web
    name: cat-empire
    runtime: node
    plan: free
    buildCommand: npm ci --no-fund --no-audit && npm audit --omit=dev --audit-level=high
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cat-empire-db-rebuild
          property: connectionString
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: CORS_ORIGIN
        value: "https://cat-empire-n6qv.onrender.com"
