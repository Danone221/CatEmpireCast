<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAT EMPIRE Preview Card</title>
<link rel="stylesheet" href="/login-real-theme.css?v=20261001-mobilefix2">
<style>
html,body{width:100%;height:100%;overflow:hidden}
body{margin:0;background:#05060a}
.preview-card{position:relative;width:100vw;height:100vh;overflow:hidden;background:#05060a}
.preview-card #liquidMetalReactRoot{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;opacity:.72!important}
.preview-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,5,10,.28) 0%,rgba(3,5,10,.10) 46%,rgba(3,5,10,.04) 100%);pointer-events:none}
.preview-copy{position:absolute;z-index:5;left:7.6%;top:50%;transform:translateY(-50%);max-width:720px}
.preview-title{margin:0 0 18px;font-family:Arial,Helvetica,sans-serif;font-size:96px;line-height:.93;font-weight:900;letter-spacing:-4px;color:#f7f8fb}
.preview-subtitle{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:28px;line-height:1.48;font-weight:400;color:#b4bac8;max-width:760px}
</style>
</head>
<body>
<div class="preview-card">
<div id="liquidMetalReactRoot" aria-hidden="true"></div>
<div class="preview-copy">
<h1 class="preview-title">CAT EMPIRE</h1>
<p class="preview-subtitle">Converse, participe de chamadas e compartilhe sua tela com seus amigos em um só lugar.</p>
</div>
</div>
<script defer src="/liquid-metal-react.bundle.js?v=20261001-mobilefix2"></script>
</body>
</html>
