<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAT EMPIRE — Convite para Servidor</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="landing-page">
<div class="sky">
  <div class="moon"></div>
  <div class="stars"></div>
  <div class="skyline"></div>
</div>

<header class="landing-topbar">
  <div class="brand">
    <a href="/" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:12px">
      <img src="/logo.svg" class="brand-logo" alt="Cat Empire"> <span>CAT EMPIRE</span>
    </a>
  </div>
</header>

<main class="landing-main" style="grid-template-columns:minmax(0,480px);justify-content:center;">
  <section class="hero" style="width:100%">
    <div class="form-card invite-card" id="inviteCard">
      <div id="inviteLoading" style="padding:40px 20px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;color:#b5bac1">
        <span style="display:inline-block;margin-bottom:12px;font-size:24px">⏳</span>
        <div>Carregando convite do servidor…</div>
      </div>
      
      <div id="inviteContent" hidden>
        <div class="invite-banner" id="inviteBanner"></div>
        <div class="invite-head">
          <div class="invite-icon-wrap" id="inviteIconWrap">
            <span id="inviteIcon">🐱</span>
          </div>
        </div>
        
        <div class="invite-body">
          <div class="invite-sub" id="inviteInviter">VOCÊ FOI CONVIDADO PARA ENTRAR EM</div>
          <h1 class="invite-title" id="inviteServerName">Servidor</h1>
          <p class="invite-desc" id="inviteDescription" hidden></p>
          
          <div class="invite-stats">
            <span class="online-count">
              <span class="dot"></span>
              <span id="inviteMembers">0 Membros</span>
            </span>
          </div>

          <div id="inviteActions" style="margin-top:22px">
            <button class="btn btn-discord" id="acceptInviteBtn" style="font-size:13px;padding:14px">ACEITAR CONVITE</button>
          </div>

          <div id="inviteAuth" hidden style="margin-top:20px;border-top:1px solid #2b2d31;padding-top:16px">
            <p class="hint" style="text-align:center;margin-top:0;margin-bottom:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;color:#949ba4">Você precisa estar conectado para entrar neste servidor:</p>
            <button class="btn btn-discord" id="inviteDiscordBtn" style="margin-bottom:14px">🎮 ENTRAR COM DISCORD</button>
            <div class="form-card" style="margin-top:0;padding:14px;background:#111214;border:1px solid #2b2d31">
              <input id="guestName" maxlength="16" placeholder="Como quer ser chamado?" style="background:#1e1f22;border:1px solid #3b1b68;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
              <button class="btn btn-primary" id="guestJoinBtn" style="font-size:12px">ENTRAR COMO CONVIDADO</button>
            </div>
          </div>
        </div>
      </div>

      <div id="inviteError" hidden style="padding:32px 24px;text-align:center">
        <div style="font-size:36px;margin-bottom:12px">😿</div>
        <h2 style="font-size:15px;color:#ff5369;margin-bottom:10px">Convite Inválido</h2>
        <p class="error" id="inviteErrorText" style="font-size:12px;margin:12px 0 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"></p>
        <a href="/" class="btn btn-primary" style="text-decoration:none;display:inline-block">VOLTAR AO INÍCIO</a>
      </div>
    </div>
  </section>
</main>

<footer class="landing-footer">
  <div class="footer-item">
    <span class="deco-icon" aria-hidden="true">☺</span>
    <div>
      <h4>COMUNIDADE</h4>
      <p>Faça parte de uma comunidade incrível</p>
    </div>
  </div>
</footer>
<p class="landing-copyright">© CAT EMPIRE • Desenvolvido por Danonin</p>

<script src="/ui.js"></script>
<script>
(async function() {
  const $ = id => document.getElementById(id);

  function getInviteCode() {
    const searchCode = new URLSearchParams(location.search).get('code');
    if (searchCode && searchCode.trim()) return searchCode.trim();

    const parts = location.pathname.split('/');
    const invIdx = parts.findIndex(p => p === 'invite' || p === 'invite.html');
    if (invIdx >= 0 && parts[invIdx + 1] && parts[invIdx + 1].trim()) {
      return parts[invIdx + 1].trim().split('?')[0];
    }
    const last = (parts[parts.length - 1] || '').trim().split('?')[0];
    if (last && last !== 'invite' && last !== 'invite.html') return last;
    return '';
  }

  const code = getInviteCode();

  if (!code) {
    showError('Nenhum código de convite informado na URL.');
    return;
  }

  let token = localStorage.getItem('cat_token');
  let userId = localStorage.getItem('cat_user_id');

  function headers() {
    return { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) };
  }

  function applyBannerStyle(el, banner) {
    if (!el) return;
    if (banner && /^(data:|https?:)/.test(banner)) {
      el.style.backgroundImage = 'url("' + banner + '")';
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
    } else {
      el.style.backgroundImage = 'none';
      el.style.backgroundColor = banner || '#5865f2';
    }
  }

  function showError(msg) {
    $('inviteLoading').hidden = true;
    $('inviteContent').hidden = true;
    $('inviteError').hidden = false;
    $('inviteErrorText').textContent = msg;
  }

  try {
    const r = await fetch('/api/invites/' + encodeURIComponent(code), { headers: headers() });
    const d = await r.json();
    if (!r.ok) {
      showError(d.error || 'Convite inválido ou expirado.');
      return;
    }

    $('inviteLoading').hidden = true;
    $('inviteContent').hidden = false;

    if (d.creatorName) {
      $('inviteInviter').textContent = d.creatorName + ' convidou você para entrar em';
    } else {
      $('inviteInviter').textContent = 'VOCÊ FOI CONVIDADO PARA ENTRAR EM';
    }
    $('inviteServerName').textContent = d.serverName || 'Servidor';
    
    if (d.serverDescription && d.serverDescription.trim()) {
      $('inviteDescription').hidden = false;
      $('inviteDescription').textContent = d.serverDescription.trim();
    } else {
      $('inviteDescription').hidden = true;
    }

    $('inviteMembers').textContent = (d.memberCount || 1) + (d.memberCount === 1 ? ' Membro' : ' Membros');

    applyBannerStyle($('inviteBanner'), d.serverBannerColor || '#5865f2');

    const isImg = d.serverIcon && /^(https?:|data:)/.test(d.serverIcon);
    if (isImg) {
      $('inviteIconWrap').innerHTML = '<img src="' + d.serverIcon + '" alt="" style="width:100%;height:100%;object-fit:cover">';
    } else {
      $('inviteIconWrap').innerHTML = '<span id="inviteIcon">' + (d.serverIcon || '🐱') + '</span>';
    }

    if (d.isMember) {
      $('acceptInviteBtn').textContent = 'VOCÊ JÁ ESTÁ NO SERVIDOR — ABRIR';
      $('acceptInviteBtn').onclick = () => {
        localStorage.setItem('cat_last_server', d.serverId);
        location.href = '/server.html?serverId=' + encodeURIComponent(d.serverId);
      };
      return;
    }

    if (!token || !userId) {
      $('inviteActions').hidden = true;
      $('inviteAuth').hidden = false;
    } else {
      $('acceptInviteBtn').onclick = () => joinServer(code);
    }

    $('inviteDiscordBtn').onclick = () => {
      localStorage.setItem('cat_pending_invite', code);
      location.href = '/auth/discord';
    };

    $('guestJoinBtn').onclick = async () => {
      const clean = ($('guestName').value.trim() || 'Cat' + Math.random().toString(36).slice(2, 7)).replace(/[^a-zA-Z0-9_]/g, '').slice(0, 16) || 'Cat';
      const password = crypto.randomUUID() + 'Aa1!';
      const username = (clean.toLowerCase() + '_' + Math.random().toString(36).slice(2, 7)).slice(0, 30);
      try {
        const rReg = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, displayName: clean })
        });
        const dReg = await rReg.json();
        if (!rReg.ok) throw new Error(dReg.error || 'Erro ao criar conta');
        token = dReg.token;
        userId = dReg.user.id;
        localStorage.setItem('cat_user_id', userId);
        localStorage.setItem('cat_user_name', dReg.user.display_name || dReg.user.username);
        localStorage.setItem('cat_token', token);
        await joinServer(code);
      } catch (e) {
        if (window.toast) toast(e.message, 'error');
        else alert(e.message);
      }
    };

  } catch (e) {
    showError(e.message || 'Erro ao carregar convite.');
  }

  async function joinServer(invCode) {
    try {
      const r = await fetch('/api/invites/' + encodeURIComponent(invCode) + '/join', {
        method: 'POST',
        headers: headers()
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Não foi possível entrar no servidor');
      localStorage.setItem('cat_last_server', d.serverId);
      location.href = '/server.html?serverId=' + encodeURIComponent(d.serverId);
    } catch (e) {
      if (window.toast) toast(e.message, 'error');
      else alert(e.message);
    }
  }
})();
</script>
</body>
</html>
