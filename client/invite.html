<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAT EMPIRE — Convite para Servidor</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="landing-page">
<div class="sky">
  <div class="moon"></div>
  <div class="stars"></div>
  <div class="skyline"></div>
</div>

<header class="landing-topbar">
  <div class="brand">
    <a href="/" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:12px">
      <img src="/logo.svg" class="brand-logo" alt="Cat Empire"> <span>CAT EMPIRE</span>
    </a>
  </div>
</header>

<main class="landing-main" style="grid-template-columns:minmax(0,480px);justify-content:center;">
  <section class="hero" style="width:100%">
    <div class="form-card invite-card" id="inviteCard">
      <div id="inviteLoading" style="padding:40px 20px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;color:#b5bac1">
        <span style="display:inline-block;margin-bottom:12px;font-size:24px">⏳</span>
        <div>Carregando convite do servidor…</div>
      </div>
      
      <div id="inviteContent" hidden>
        <div class="invite-banner" id="inviteBanner"></div>
        <div class="invite-head">
          <div class="invite-icon-wrap" id="inviteIconWrap">
            <span id="inviteIcon">🐱</span>
          </div>
        </div>
        
        <div class="invite-body">
          <div class="invite-sub" id="inviteInviter">VOCÊ FOI CONVIDADO PARA ENTRAR EM</div>
          <h1 class="invite-title" id="inviteServerName">Servidor</h1>
          <p class="invite-desc" id="inviteDescription" hidden></p>
          
          <div class="invite-stats">
            <span class="online-count">
              <span class="dot"></span>
              <span id="inviteMembers">0 Membros</span>
            </span>
          </div>

          <div id="inviteActions" style="margin-top:22px">
            <button class="btn btn-discord" id="acceptInviteBtn" style="font-size:13px;padding:14px">ACEITAR CONVITE</button>
          </div>

          <div id="inviteAuth" hidden style="margin-top:20px;border-top:1px solid #2b2d31;padding-top:16px">
            <p class="hint" style="text-align:center;margin-top:0;margin-bottom:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;color:#949ba4">Você precisa estar conectado para entrar neste servidor:</p>
            <button class="btn btn-discord" id="inviteDiscordBtn" style="margin-bottom:14px">🎮 ENTRAR COM DISCORD</button>
            <div class="form-card" style="margin-top:0;padding:14px;background:#111214;border:1px solid #2b2d31">
              <input id="guestName" maxlength="16" placeholder="Como quer ser chamado?" style="background:#1e1f22;border:1px solid #3b1b68;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
              <button class="btn btn-primary" id="guestJoinBtn" style="font-size:12px">ENTRAR COMO CONVIDADO</button>
            </div>
          </div>
        </div>
      </div>

      <div id="inviteError" hidden style="padding:32px 24px;text-align:center">
        <div style="font-size:36px;margin-bottom:12px">😿</div>
        <h2 style="font-size:15px;color:#ff5369;margin-bottom:10px">Convite Inválido</h2>
        <p class="error" id="inviteErrorText" style="font-size:12px;margin:12px 0 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"></p>
        <a href="/" class="btn btn-primary" style="text-decoration:none;display:inline-block">VOLTAR AO INÍCIO</a>
      </div>
    </div>
  </section>
</main>

<footer class="landing-footer">
  <div class="footer-item">
    <span class="deco-icon" aria-hidden="true">☺</span>
    <div>
      <h4>COMUNIDADE</h4>
      <p>Faça parte de uma comunidade incrível</p>
    </div>
  </div>
</footer>
<p class="landing-copyright">© CAT EMPIRE • Desenvolvido por Danonin</p>

<script src="/ui.js"></script>
<script src="/invite.js"></script>
</body>
</html>
